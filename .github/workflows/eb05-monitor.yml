name: One Piece Stock Monitor (EB-05 + OP-18)

on:
  schedule:
    # Respaldo horario independiente de Cloudflare (principal: cada 30 min).
    # Minuto 17 para evitar coincidir con las ejecuciones de las :00 y :30.
    - cron: "17 * * * *"

  workflow_dispatch:
    inputs:
      send_test_notification:
        description: "Enviar un mensaje de prueba por Telegram"
        required: false
        type: boolean
        default: false

  # Sirve para validar automáticamente cambios en el monitor.
  # Los commits de state.json NO vuelven a disparar el workflow.
  push:
    branches:
      - main
    paths:
      - "monitor.py"
      - "product_guard.py"
      - "diagnose_sources.py"
      - "herofreaks_source.py"
      - "logpose_sources.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/eb05-monitor.yml"

permissions:
  contents: write

concurrency:
  group: eb05-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Test product-specific JSON-LD parser
        run: python -m unittest discover -s tests -v

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Refresh latest monitor state
        run: |
          git fetch origin main
          git checkout origin/main -- state.json

      - name: Check One Piece stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST_NOTIFICATION: ${{ github.event.inputs.send_test_notification || 'false' }}
        run: python monitor.py

      - name: Persist new stock states and pending alerts
        id: persist_alerts
        run: bash scripts/persist_state.sh

      # Enviar SOLO después de guardar los eventos en GitHub. Si el push
      # falla, NO se envía nada y el workflow queda marcado como error.
      - name: Deliver queued Telegram notifications
        id: deliver_alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python deliver_alerts.py

      # Se ejecuta incluso si el despachador falla a mitad, para persistir
      # los acuses confirmados y evitar duplicados en la próxima ejecución.
      - name: Persist Telegram delivery acknowledgements
        if: ${{ always() && steps.persist_alerts.outcome == 'success' }}
        run: bash scripts/persist_state.sh
