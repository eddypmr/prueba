name: EB-05 Stock Monitor

on:
  schedule:
    # Cada 30 minutos. Evitamos el minuto 00 para reducir retrasos del scheduler.
    - cron: "7,37 * * * *"

  workflow_dispatch:
    inputs:
      send_test_notification:
        description: "Enviar un mensaje de prueba por Telegram"
        required: false
        type: boolean
        default: false

  # Sirve para validar automáticamente cambios en el monitor.
  # Los commits de state.json NO vuelven a disparar el workflow.
  push:
    branches:
      - main
    paths:
      - "monitor.py"
      - "requirements.txt"
      - ".github/workflows/eb05-monitor.yml"

permissions:
  contents: write

concurrency:
  group: eb05-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Check EB-05 stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SEND_TEST_NOTIFICATION: ${{ github.event.inputs.send_test_notification || 'false' }}
        run: python monitor.py

      - name: Persist monitor state when it changes
        run: |
          if git diff --quiet -- state.json; then
            echo "No state changes to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update EB-05 monitor state [skip ci]"

          # Si main avanzó mientras corría el monitor, integra esos cambios
          # antes de publicar el nuevo estado.
          git pull --rebase origin main
          git push origin main
