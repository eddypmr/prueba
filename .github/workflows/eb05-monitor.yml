name: One Piece Stock Monitor (EB-05 + OP-18)

on:
  schedule:
    # Redundancia cada 15 minutos para compensar retrasos/saltos del scheduler de GitHub.
    # Evitamos 00/15/30/45, que suelen tener más carga.
    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:
    inputs:
      send_test_notification:
        description: "Enviar un mensaje de prueba por Telegram"
        required: false
        type: boolean
        default: false

  # Sirve para validar automáticamente cambios en el monitor.
  # Los commits de state.json NO vuelven a disparar el workflow.
  push:
    branches:
      - main
    paths:
      - "monitor.py"
      - "requirements.txt"
      - ".github/workflows/eb05-monitor.yml"

permissions:
  contents: write

concurrency:
  group: eb05-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Check One Piece stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST_NOTIFICATION: ${{ github.event.inputs.send_test_notification || 'false' }}
        run: python monitor.py

      - name: Persist monitor state when it changes
        run: |
          if git diff --quiet -- state.json; then
            echo "No state changes to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Conservamos el estado generado por esta ejecución. Si main avanzó
          # mientras corríamos, fusionamos state.json por timestamp en vez de
          # hacer un rebase ciego que pueda producir conflictos.
          cp state.json /tmp/local_state.json

          for attempt in 1 2 3; do
            git fetch origin main
            git show origin/main:state.json > /tmp/remote_state.json 2>/dev/null || echo '{}' > /tmp/remote_state.json

            python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          local = json.loads(Path("/tmp/local_state.json").read_text(encoding="utf-8"))
          remote = json.loads(Path("/tmp/remote_state.json").read_text(encoding="utf-8"))

          def parse_ts(value):
              if not value:
                  return datetime.min
              try:
                  return datetime.fromisoformat(value.replace("Z", "+00:00")).replace(tzinfo=None)
              except Exception:
                  return datetime.min

          merged = dict(remote)

          for key, local_value in local.items():
              if key == "_meta":
                  remote_meta = dict(remote.get("_meta", {}))
                  local_meta = dict(local_value or {})
                  for meta_key, meta_value in local_meta.items():
                      if meta_key == "last_status_report":
                          remote_value = remote_meta.get(meta_key)
                          if parse_ts(meta_value) >= parse_ts(remote_value):
                              remote_meta[meta_key] = meta_value
                      else:
                          remote_meta[meta_key] = meta_value
                  merged["_meta"] = remote_meta
                  continue

              remote_value = remote.get(key)
              if not isinstance(local_value, dict) or not isinstance(remote_value, dict):
                  merged[key] = local_value
                  continue

              local_changed = parse_ts(local_value.get("last_changed"))
              remote_changed = parse_ts(remote_value.get("last_changed"))

              if local_changed >= remote_changed:
                  merged[key] = local_value

          Path("/tmp/merged_state.json").write_text(
              json.dumps(merged, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

            git reset --hard origin/main
            cp /tmp/merged_state.json state.json

            if git diff --quiet -- state.json; then
              echo "Remote state already contains these changes."
              exit 0
            fi

            git add state.json
            git commit -m "chore: update One Piece monitor state [skip ci]"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push race detected; merging the newest remote state and retrying ($attempt/3)."
            cp state.json /tmp/local_state.json
            sleep 2
          done

          echo "Could not persist state after 3 attempts."
          exit 1
